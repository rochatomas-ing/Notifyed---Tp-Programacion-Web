openapi: 3.0.0
info:
  title: Notifyed API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get all users
      responses:
        '200':
          description: A list of users
    post:
      summary: Create a new user
      responses:
        '201':
          description: User created successfully
  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
        '404':
          description: User not found
    put:
      summary: Update a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User updated successfully
        '404':
          description: User not found
    delete:
      summary: Delete a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
  /notices:
    get:
      summary: Get all notices
      responses:
        '200':
          description: A list of notices
    post:
      summary: Create a new notice
      responses:
        '201':
          description: Notice created successfully
  /notices/{id}:
    get:
      summary: Get a notice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notice details
        '404':
          description: Notice not found
    put:
      summary: Update a notice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notice updated successfully
        '404':
          description: Notice not found
    delete:
      summary: Delete a notice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Notice deleted successfully
        '404':
          description: Notice not found    
  /inscriptions/{id}:
    delete:
      summary: Delete an inscription by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Inscription deleted successfully
        '404':
          description: Inscription not found
  /inscriptions/{id}/toggle:
    post:
      summary: Toggle the status of an inscription by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inscription status toggled successfully
        '404':
          description: Inscription not found
  /courses:
    get:
      summary: Get all courses
      responses:
        '200':
          description: A list of courses
    post:
      summary: Create a new course
      responses:
        '201':
          description: Course created successfully
  /courses/{id}:
    get:
      summary: Get a course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course details
        '404':
          description: Course not found
    put:
      summary: Update a course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course updated successfully
        '404':
          description: Course not found
    delete:
      summary: Delete a course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Course deleted successfully
        '404':
          description: Course not found
  /courses/{courseId}/semesters:
    get:
      summary: Get all semesters for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of semesters for the course
        '404':
          description: Course not found
  /semesters/{idOrToken}:
    get:
      summary: Get a semester by ID
      parameters:
        - name: idOrToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Semester details
        '404':
          description: Semester not found
    put:
      summary: Update a semester by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Semester updated successfully
        '404':
          description: Semester not found
    delete:
      summary: Delete a semester by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Semester deleted successfully
        '404':
          description: Semester not found
  /semesters:
    get:
      summary: Get all semesters
      responses:
        '200':
          description: A list of semesters
    post:
      summary: Create a new semester
      responses:
        '201':
          description: Semester created successfully
  /semesters/{idOrToken}/inscriptions:
    get:
      summary: Get all inscriptions for a semester
      parameters:
        - name: idOrToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of inscriptions for the semester
        '404':
          description: Semester not found
    post:
      summary: Create a new inscription for a semester
      parameters:
        - name: idOrToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Inscription created successfully
        '404':
          description: Semester not found
    delete:
      summary: Delete all inscriptions for a semester
      parameters:
        - name: idOrToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Inscriptions deleted successfully
        '404':
          description: Semester not found
  /semester/{id}/suscriptos:
    get:
      summary: Get all suscriptos for a semester
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of suscriptos for the semester
        '404':
          description: Semester not found
  /semesters/{id}/notices:
    get:
      summary: Get all notices for a semester
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of notices for the semester
        '404':
          description: Semester not found
    